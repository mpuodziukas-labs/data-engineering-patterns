name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest

      - name: Check Python syntax (all .py files)
        run: |
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || exit 1
          done

      - name: Run patterns/ tests (pure Python, no Spark required)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest patterns/tests/ -v --tb=short

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --select E,F,W --ignore E501,W503
        # E501: line length — intentionally verbose for documented examples
        # W503: line break before binary operator — style preference

  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check SQL syntax (basic parse)
        run: |
          python -c "
          import os
          sql_files = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.git', '__pycache__', '.venv']]
              for f in files:
                  if f.endswith('.sql'):
                      sql_files.append(os.path.join(root, f))
          print(f'Found {len(sql_files)} SQL files')
          for f in sql_files:
              with open(f) as fh:
                  content = fh.read()
              print('OK:', f) if content else print('WARN: empty', f)
          "
