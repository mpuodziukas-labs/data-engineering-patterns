name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax (all .py files)
        run: |
          find . -name "*.py" -not -path "./.git/*" | while read f; do
            python -m py_compile "$f" && echo "OK: $f" || exit 1
          done

      - name: Check SQL syntax (basic jinja2 parse)
        run: |
          python -c "
          import os, sys
          sql_files = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.git', '__pycache__', '.venv']]
              for f in files:
                  if f.endswith('.sql'):
                      sql_files.append(os.path.join(root, f))
          print(f'Found {len(sql_files)} SQL files')
          for f in sql_files:
              with open(f) as fh:
                  content = fh.read()
              if len(content) == 0:
                  print(f'WARN: empty file {f}')
              else:
                  print(f'OK: {f}')
          "

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install test-only dependencies (skip Spark for CI speed; use mocks)
          pip install pytest pytest-mock pyspark==3.5.4 delta-spark==3.2.1

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --select E,F,W --ignore E501,W503
        # E501: line length — intentionally ignored for SQL-heavy files
        # W503: line break before binary operator — style preference
